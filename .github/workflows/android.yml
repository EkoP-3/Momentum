name: Android

# Android Studio olmadan APK/AAB üretir.
#  - Her push/PR: web derlemesi + Java birim testleri + kurulabilir DEBUG APK (Actions → Artifacts)
#  - Elle çalıştır (Run workflow → release): imzalı Play Store paketi (AAB). Gizli anahtarlar için docs/PLAY_STORE.md
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı release AAB üret (Play Store için)"
        type: boolean
        default: false

permissions:
  contents: write # APK'yı Releases sayfasına koyabilmek için

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK paketleri ve lisanslar
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: bun install --frozen-lockfile

      - name: Tür denetimi ve lint
        run: |
          bun run typecheck
          bun run lint

      - name: Web paketini derle ve Android projesine kopyala
        run: bun run cap:sync

      - name: Java birim testleri + debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Debug APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: momentum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK'yı Releases sayfasına koy (debug-latest)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk momentum-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest momentum-debug.apk \
            --prerelease \
            --title "Momentum debug APK" \
            --notes "Son derleme: ${GITHUB_SHA::7}. APK'yı indirip telefona kur; eskisinin üstüne güncelleme olarak kurulur." \
            --target "$GITHUB_SHA"

      - name: Release için anahtar deposunu hazırla
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 gizli anahtarı tanımlı değil (docs/PLAY_STORE.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/momentum-release.jks"

      - name: İmzalı release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        working-directory: android
        env:
          MOMENTUM_KEYSTORE_FILE: ${{ runner.temp }}/momentum-release.jks
          MOMENTUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOMENTUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOMENTUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ github.run_number }}

      - name: Release AAB'yi yükle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: momentum-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
